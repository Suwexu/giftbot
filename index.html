<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Колесо Бонусов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 15px;
            overflow-x: hidden;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .header h1 {
            font-size: 26px;
            background: linear-gradient(90deg, #f5c842, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .balance-container {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 20px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            border: 1px solid rgba(245, 200, 66, 0.2);
        }
        
        .balance-icon {
            font-size: 24px;
        }
        
        .balance-amount {
            font-size: 22px;
            font-weight: bold;
            color: #f5c842;
        }
        
        #spinCanvas {
            display: block;
            width: 100%;
            max-width: 400px;
            height: auto;
            aspect-ratio: 1/1;
            margin: 0 auto 20px;
            border-radius: 50%;
            box-shadow: 
                0 0 30px rgba(245, 200, 66, 0.1),
                inset 0 0 30px rgba(245, 200, 66, 0.05);
            background: #2d3a5e;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.3s ease;
        }
        
        #spinCanvas:active {
            transform: scale(0.98);
        }
        
        .status-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 15px;
            margin: 15px 0;
            font-size: 16px;
            text-align: center;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.05);
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .status-box .emoji {
            font-size: 24px;
            margin-right: 10px;
        }
        
        #spinBtn {
            background: linear-gradient(145deg, #f5c842, #d4a021);
            border: none;
            color: #1a1a2e;
            font-weight: bold;
            font-size: 20px;
            padding: 16px 32px;
            border-radius: 50px;
            width: 100%;
            max-width: 280px;
            box-shadow: 0 5px 25px rgba(245, 200, 66, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        
        #spinBtn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: rotate(45deg);
            transition: all 0.5s ease;
        }
        
        #spinBtn:hover:not(:disabled)::before {
            left: 100%;
        }
        
        #spinBtn:active:not(:disabled) {
            transform: scale(0.95);
        }
        
        #spinBtn:disabled {
            background: #444;
            color: #888;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .timer {
            font-size: 18px;
            color: #ff6b6b;
            font-weight: bold;
            margin-top: 15px;
            text-align: center;
            font-family: 'Courier New', monospace;
        }
        
        .footer {
            margin-top: 20px;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
        }
        
        .prize-history {
            margin-top: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 10px;
            max-height: 80px;
            overflow-y: auto;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            display: none;
        }
        
        /* Анимация для выигрыша */
        @keyframes winPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .win-animation {
            animation: winPulse 0.5s ease 3;
        }
        
        /* Стилизация скролла */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(245, 200, 66, 0.3);
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎡 Колесо Бонусов</h1>
        </div>
        
        <div class="balance-container">
            <span class="balance-icon">💰</span>
            <span class="balance-amount" id="balanceDisplay">0</span>
        </div>
        
        <canvas id="spinCanvas" width="600" height="600"></canvas>
        
        <div class="status-box" id="statusMessage">
            <span class="emoji">⏳</span>
            <span>Проверка...</span>
        </div>
        
        <div style="text-align: center;">
            <button id="spinBtn" disabled>🎰 Крутить!</button>
        </div>
        
        <div id="timerDisplay" class="timer"></div>
        
        <div class="footer">
            Вращение доступно раз в 24 часа
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        // ---------- НАСТРОЙКИ КОЛЕСА ----------
        const segments = [
            { label: '100', value: 100, color: '#f94144' },
            { label: '50', value: 50, color: '#f3722c' },
            { label: '20', value: 20, color: '#f8961e' },
            { label: '10', value: 10, color: '#f9c74f' },
            { label: '5', value: 5, color: '#90be6d' },
            { label: '200', value: 200, color: '#43aa8b' },
            { label: '0', value: 0, color: '#577590' },
            { label: '⭐', value: 50, color: '#9b5de5' }
        ];
        
        const canvas = document.getElementById('spinCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const statusMsg = document.getElementById('statusMessage');
        const timerDisplay = document.getElementById('timerDisplay');
        const balanceDisplay = document.getElementById('balanceDisplay');
        
        const segmentAngle = (2 * Math.PI) / segments.length;
        let currentRotation = 0;
        let isSpinning = false;
        let canSpin = false;
        
        // ---------- РИСОВАНИЕ КОЛЕСА ----------
        function drawWheel(rotation) {
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = Math.min(width, height) / 2 * 0.88;
            
            ctx.clearRect(0, 0, width, height);
            
            // Тень
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 30;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 10;
            
            for (let i = 0; i < segments.length; i++) {
                const startAngle = rotation + i * segmentAngle;
                const endAngle = startAngle + segmentAngle;
                
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();
                
                // Градиент для каждого сектора
                const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
                gradient.addColorStop(0, lightenColor(segments[i].color, 30));
                gradient.addColorStop(1, segments[i].color);
                ctx.fillStyle = gradient;
                ctx.fill();
                
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Текст
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + segmentAngle / 2);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                const textRadius = radius * 0.65;
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 24px -apple-system, "Segoe UI", Roboto, sans-serif';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 10;
                ctx.fillText(segments[i].label, textRadius, 0);
                ctx.restore();
            }
            
            // Центральный круг
            ctx.shadowBlur = 0;
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 30);
            gradient.addColorStop(0, '#ffd700');
            gradient.addColorStop(1, '#f5a623');
            ctx.beginPath();
            ctx.arc(centerX, centerY, 25, 0, 2 * Math.PI);
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // Стрелка указатель
            const pointerY = 15;
            ctx.shadowColor = 'rgba(255,215,0,0.5)';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.moveTo(centerX - 15, pointerY);
            ctx.lineTo(centerX + 15, pointerY);
            ctx.lineTo(centerX, pointerY + 30);
            ctx.closePath();
            ctx.fillStyle = '#ffd700';
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        
        // Вспомогательная функция для осветления цвета
        function lightenColor(color, percent) {
            const num = parseInt(color.replace('#',''), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.min(255, (num >> 16) + amt);
            const G = Math.min(255, (num >> 8 & 0x00FF) + amt);
            const B = Math.min(255, (num & 0x0000FF) + amt);
            return `#${(1 << 24 | R << 16 | G << 8 | B).toString(16).slice(1)}`;
        }
        
        // ---------- ОПРЕДЕЛЕНИЕ ВЫИГРЫША ----------
        function getPrize(rotation) {
            const pointerAngle = -Math.PI / 2;
            let rawAngle = (pointerAngle - rotation) % (2 * Math.PI);
            if (rawAngle < 0) rawAngle += 2 * Math.PI;
            
            const index = Math.floor(rawAngle / segmentAngle) % segments.length;
            return {
                index: index,
                label: segments[index].label,
                value: segments[index].value
            };
        }
        
        // ---------- АНИМАЦИЯ ВРАЩЕНИЯ ----------
        function spinWheel() {
            if (isSpinning || !canSpin) return;
            isSpinning = true;
            spinBtn.disabled = true;
            updateStatus('🌀', 'Колесо вращается...');
            
            const extraSpins = 5 + Math.random() * 3;
            const targetAngle = extraSpins * 2 * Math.PI + Math.random() * 2 * Math.PI;
            const startRotation = currentRotation;
            const endRotation = startRotation + targetAngle;
            const duration = 4000;
            const startTime = performance.now();
            
            function animate(time) {
                const elapsed = time - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 3);
                const currentAngle = startRotation + targetAngle * ease;
                currentRotation = currentAngle;
                drawWheel(currentAngle);
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    currentRotation = endRotation;
                    drawWheel(endRotation);
                    
                    const prize = getPrize(endRotation);
                    const prizeData = {
                        prize_id: prize.index,
                        prize_name: prize.label,
                        value: prize.value
                    };
                    
                    // Отправка результата боту
                    tg.sendData('spin_result:' + JSON.stringify(prizeData));
                    
                    isSpinning = false;
                    spinBtn.disabled = true;
                    
                    updateStatus('🎁', `Выпало: ${prize.label} ${prize.value > 0 ? 'монет' : ''}`);
                    
                    setTimeout(() => {
                        checkStatus();
                    }, 2000);
                }
            }
            requestAnimationFrame(animate);
        }
        
        // ---------- ОБНОВЛЕНИЕ ИНТЕРФЕЙСА ----------
        function updateStatus(emoji, text) {
            statusMsg.innerHTML = `<span class="emoji">${emoji}</span><span>${text}</span>`;
        }
        
        function updateTimer(seconds) {
            if (seconds <= 0) {
                timerDisplay.textContent = '';
                return;
            }
            const hours = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            timerDisplay.textContent = `⏳ ${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }
        
        function updateBalance(balance) {
            balanceDisplay.textContent = balance;
            // Анимация при обновлении
            balanceDisplay.parentElement.classList.add('win-animation');
            setTimeout(() => {
                balanceDisplay.parentElement.classList.remove('win-animation');
            }, 500);
        }
        
        // ---------- ПРОВЕРКА СТАТУСА ----------
        function checkStatus() {
            updateStatus('⏳', 'Проверка...');
            spinBtn.disabled = true;
            tg.sendData('get_status');
        }
        
        // ---------- ОБРАБОТКА ОТВЕТОВ ОТ БОТА ----------
        tg.onEvent('message', (event) => {
            try {
                const data = JSON.parse(event.data);
                console.log('Ответ от бота:', data);
                
                if (data.status === 'can_spin') {
                    canSpin = true;
                    spinBtn.disabled = false;
                    updateStatus('🎯', 'Нажми на кнопку или коснись колеса!');
                    timerDisplay.textContent = '';
                    if (data.balance !== undefined) {
                        updateBalance(data.balance);
                    }
                } else if (data.status === 'wait') {
                    canSpin = false;
                    spinBtn.disabled = true;
                    updateStatus('⏳', 'Кулдаун активен!');
                    updateTimer(data.wait_time);
                    if (data.balance !== undefined) {
                        updateBalance(data.balance);
                    }
                    
                    // Таймер обратного отсчета
                    if (window.timerInterval) clearInterval(window.timerInterval);
                    let remaining = data.wait_time;
                    window.timerInterval = setInterval(() => {
                        remaining--;
                        updateTimer(remaining);
                        if (remaining <= 0) {
                            clearInterval(window.timerInterval);
                            checkStatus();
                        }
                    }, 1000);
                } else if (data.status === 'success') {
                    // Успешное вращение
                    updateStatus('🎉', `Выиграно ${data.prize} монет!`);
                    if (data.new_balance !== undefined) {
                        updateBalance(data.new_balance);
                    }
                    // Показываем уведомление в Telegram
                    tg.showPopup({
                        title: '🎉 Поздравляем!',
                        message: `Вы выиграли ${data.value} монет!`,
                        buttons: [{ type: 'ok' }]
                    });
                } else if (data.error) {
                    updateStatus('❌', data.error);
                }
            } catch (e) {
                console.error('Ошибка парсинга:', e);
                // Если ответ не JSON - это простое текстовое сообщение
                updateStatus('📨', event.data);
            }
        });
        
        // ---------- ИНИЦИАЛИЗАЦИЯ ----------
        drawWheel(0);
        
        spinBtn.addEventListener('click', spinWheel);
        canvas.addEventListener('click', () => {
            if (canSpin && !isSpinning) spinWheel();
        });
        
        // Запрос статуса при загрузке
        setTimeout(checkStatus, 500);
        
        // Настройка внешнего вида Telegram App
        tg.setHeaderColor('#1a1a2e');
        tg.setBackgroundColor('#1a1a2e');
        
        console.log('🎡 Колесо бонусов загружено!');
    </script>
</body>
</html>
