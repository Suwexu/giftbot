<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Открытие кейса</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 50% 0%, #1b2838 0%, #0e1621 60%, #0a0f16 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 16px;
            color: #fff;
        }
        .container { width: 100%; max-width: 480px; }
        .header { text-align: center; margin-bottom: 14px; }
        .header h1 {
            font-size: 24px;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #de9b35, #ffcf6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .balance-container {
            background: rgba(0,0,0,0.35);
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            border: 1px solid rgba(222,155,53,0.3);
        }
        .balance-amount { font-size: 20px; font-weight: bold; color: #de9b35; }

        /* ===== КЕЙС / РИЛ ===== */
        .case-wrap {
            position: relative;
            margin: 18px 0 10px;
        }
        .pointer {
            position: absolute;
            left: 50%;
            top: -6px;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 14px solid #de9b35;
            z-index: 5;
            filter: drop-shadow(0 0 6px rgba(222,155,53,0.8));
        }
        .center-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, #de9b35, rgba(222,155,53,0));
            transform: translateX(-50%);
            z-index: 4;
        }
        .reel-viewport {
            overflow: hidden;
            height: 130px;
            border-radius: 14px;
            background: linear-gradient(180deg, #16202c, #0d151d);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
            position: relative;
        }
        .reel-viewport::before, .reel-viewport::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0;
            width: 40px;
            z-index: 3;
            pointer-events: none;
        }
        .reel-viewport::before {
            left: 0;
            background: linear-gradient(90deg, #0d151d, rgba(13,21,29,0));
        }
        .reel-viewport::after {
            right: 0;
            background: linear-gradient(270deg, #0d151d, rgba(13,21,29,0));
        }
        .reel {
            display: flex;
            align-items: center;
            height: 100%;
            will-change: transform;
        }
        .case-item {
            flex: 0 0 112px;
            height: 110px;
            margin: 0 8px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8px;
            background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.2));
            border: 1px solid rgba(255,255,255,0.08);
            position: relative;
            overflow: hidden;
        }
        .case-item::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: var(--c, #de9b35);
        }
        .case-item .icon { font-size: 26px; margin-bottom: 6px; }
        .case-item .label { font-size: 12px; font-weight: 600; line-height: 1.25; }
        .case-item.winner {
            box-shadow: 0 0 18px var(--c, #de9b35);
            border-color: var(--c, #de9b35);
        }

        .status-box {
            background: rgba(0,0,0,0.3);
            padding: 14px;
            border-radius: 15px;
            margin: 14px 0;
            font-size: 15px;
            text-align: center;
            min-height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .status-box .emoji { font-size: 22px; margin-right: 8px; }
        .status-box .retry-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 5px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }
        #spinBtn {
            background: linear-gradient(145deg, #de9b35, #b97a1f);
            border: none;
            color: #1a1a2e;
            font-weight: bold;
            font-size: 18px;
            padding: 15px 32px;
            border-radius: 50px;
            width: 100%;
            box-shadow: 0 5px 25px rgba(222,155,53,0.3);
            cursor: pointer;
            transition: opacity 0.3s;
            display: block;
        }
        #spinBtn:disabled {
            background: #333c46;
            color: #7a8794;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .timer {
            font-size: 18px;
            color: #ff6b6b;
            font-weight: bold;
            margin-top: 12px;
            text-align: center;
            font-family: 'Courier New', monospace;
        }
        .footer {
            margin-top: 18px;
            text-align: center;
            color: rgba(255,255,255,0.3);
            font-size: 12px;
        }
        .debug-info {
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 11px;
            color: #aaa;
            max-height: 120px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎁 Открытие кейса</h1>
            <div class="balance-container">
                <span>💰</span>
                <span class="balance-amount" id="balanceDisplay">0</span>
            </div>
        </div>

        <div class="case-wrap">
            <div class="pointer"></div>
            <div class="center-line"></div>
            <div class="reel-viewport">
                <div class="reel" id="reel"></div>
            </div>
        </div>

        <div class="status-box" id="statusMessage">
            <span class="emoji">⏳</span>
            <span>Загрузка...</span>
        </div>

        <button id="spinBtn" disabled>🎁 Открыть кейс</button>
        <div id="timerDisplay" class="timer"></div>
        <div class="footer">Открытие доступно раз в 24 часа</div>
        <div id="debugInfo" class="debug-info"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const API_BASE = 'https://cyberxgift.ru';
        const ICONS = ['💎', '🪙', '⭐', '🎮', '🔥', '🏆'];

        const reel = document.getElementById('reel');
        const spinBtn = document.getElementById('spinBtn');
        const statusMsg = document.getElementById('statusMessage');
        const timerDisplay = document.getElementById('timerDisplay');
        const balanceDisplay = document.getElementById('balanceDisplay');
        const debugInfo = document.getElementById('debugInfo');

        let prizesPool = [];
        let canSpin = false;
        let isSpinning = false;
        let timerInterval = null;

        function addDebug(msg) {
            const time = new Date().toLocaleTimeString();
            console.log(`🐛 ${time}: ${msg}`);
            debugInfo.innerHTML += `<div>${time}: ${msg}</div>`;
            debugInfo.scrollTop = debugInfo.scrollHeight;
        }

        function updateStatus(emoji, text, isError = false) {
            const emojiSpan = `<span class="emoji">${emoji}</span>`;
            const textSpan = `<span style="${isError ? 'color:#ff6b6b;' : ''}">${text}</span>`;
            const retryBtn = isError ? `<button class="retry-btn" onclick="checkStatus()">🔄 Повторить</button>` : '';
            statusMsg.innerHTML = emojiSpan + textSpan + retryBtn;
        }

        function updateTimer(seconds) {
            if (seconds <= 0) { timerDisplay.textContent = ''; return; }
            const h = Math.floor(seconds/3600), m = Math.floor((seconds%3600)/60), s = seconds%60;
            timerDisplay.textContent = `⏳ ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }

        function updateBalance(balance) { balanceDisplay.textContent = balance; }

        function iconFor(prize) {
            return prize.is_points ? '🪙' : '🎮';
        }

        function renderItem(prize) {
            const el = document.createElement('div');
            el.className = 'case-item';
            el.style.setProperty('--c', prize.color || '#de9b35');
            el.innerHTML = `<div class="icon">${iconFor(prize)}</div><div class="label">${prize.label}</div>`;
            return el;
        }

        // ===== API =====
        async function apiFetch(path, options = {}) {
            const controller = new AbortController();
            const t = setTimeout(() => controller.abort(), 15000);
            try {
                const resp = await fetch(API_BASE + path, { ...options, signal: controller.signal });
                clearTimeout(t);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                return await resp.json();
            } catch (e) {
                clearTimeout(t);
                throw e;
            }
        }

        async function loadPrizes() {
            const data = await apiFetch('/api/prizes');
            prizesPool = data.prizes || [];
            buildIdleReel();
        }

        function buildIdleReel() {
            reel.innerHTML = '';
            if (prizesPool.length === 0) return;
            for (let i = 0; i < 12; i++) {
                reel.appendChild(renderItem(prizesPool[i % prizesPool.length]));
            }
        }

        async function checkStatus() {
            addDebug('🔍 Проверка статуса...');
            updateStatus('⏳', 'Проверка...');
            spinBtn.disabled = true;
            try {
                const data = await apiFetch(`/api/status?init_data=${encodeURIComponent(tg.initData)}`);
                addDebug(`📨 Ответ: status=${data.status}`);
                handleServerResponse(data);
            } catch (e) {
                addDebug(`⏰ Ошибка запроса: ${e.message}`);
                updateStatus('⚠️', 'Нет ответа от сервера', true);
                spinBtn.disabled = true;
            }
        }

        function handleServerResponse(data) {
            if (data.status === 'can_spin') {
                canSpin = true;
                spinBtn.disabled = false;
                updateStatus('🎯', 'Кейс готов! Жми на кнопку');
                timerDisplay.textContent = '';
                if (data.balance !== undefined) updateBalance(data.balance);

            } else if (data.status === 'wait') {
                canSpin = false;
                spinBtn.disabled = true;
                updateStatus('⏳', 'Кулдаун активен!');
                updateTimer(data.wait_time);
                if (data.balance !== undefined) updateBalance(data.balance);

                if (timerInterval) clearInterval(timerInterval);
                let remaining = data.wait_time;
                timerInterval = setInterval(() => {
                    remaining--;
                    updateTimer(remaining);
                    if (remaining <= 0) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        checkStatus();
                    }
                }, 1000);

            } else if (data.error) {
                updateStatus('❌', data.error, true);
            }
        }

        // ===== АНИМАЦИЯ ОТКРЫТИЯ КЕЙСА =====
        const ITEM_STEP = 128; // ширина .case-item + 2*margin(8px) = 112+16
        const REEL_LENGTH = 45;
        const TARGET_INDEX = REEL_LENGTH - 7;

        function buildSpinReel(winningPrize) {
            reel.style.transition = 'none';
            reel.style.transform = 'translateX(0px)';
            reel.innerHTML = '';

            for (let i = 0; i < REEL_LENGTH; i++) {
                const prize = (i === TARGET_INDEX)
                    ? winningPrize
                    : prizesPool[Math.floor(Math.random() * prizesPool.length)];
                const el = renderItem(prize);
                if (i === TARGET_INDEX) el.classList.add('target-cell');
                reel.appendChild(el);
            }
        }

        async function spinCase() {
            if (isSpinning || !canSpin || prizesPool.length === 0) return;
            isSpinning = true;
            spinBtn.disabled = true;
            updateStatus('🌀', 'Открываем кейс...');

            let result;
            try {
                result = await apiFetch('/api/spin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ init_data: tg.initData })
                });
            } catch (e) {
                addDebug(`❌ Ошибка запроса спина: ${e.message}`);
                updateStatus('⚠️', 'Нет ответа от сервера', true);
                isSpinning = false;
                spinBtn.disabled = false;
                return;
            }

            if (result.status === 'wait') {
                isSpinning = false;
                handleServerResponse(result);
                return;
            }
            if (result.error) {
                isSpinning = false;
                updateStatus('❌', result.error, true);
                spinBtn.disabled = false;
                return;
            }

            const prize = result.prize;
            buildSpinReel(prize);

            const viewportWidth = reel.parentElement.clientWidth;
            const jitter = (Math.random() - 0.5) * ITEM_STEP * 0.5;
            const targetOffset = TARGET_INDEX * ITEM_STEP + ITEM_STEP / 2;
            const translateX = viewportWidth / 2 - targetOffset + jitter;

            requestAnimationFrame(() => {
                reel.style.transition = 'transform 4.2s cubic-bezier(0.12, 0.65, 0.15, 1)';
                reel.style.transform = `translateX(${translateX}px)`;
            });

            setTimeout(() => {
                const cells = reel.querySelectorAll('.case-item');
                if (cells[TARGET_INDEX]) cells[TARGET_INDEX].classList.add('winner');

                const prizeText = prize.is_points
                    ? `${prize.label}!`
                    : `${prize.label} 🎉`;
                updateStatus('🎉', `Выпало: ${prizeText}`);
                if (result.new_balance !== undefined) updateBalance(result.new_balance);

                try {
                    tg.showPopup({
                        title: '🎉 Поздравляем!',
                        message: prize.is_points
                            ? `Вы выиграли ${prize.value} монет!`
                            : `Вы выиграли: ${prize.label}!`,
                        buttons: [{ type: 'ok' }]
                    });
                } catch (e) {}

                isSpinning = false;
                setTimeout(checkStatus, 3000);
            }, 4400);
        }

        spinBtn.addEventListener('click', spinCase);

        // ===== СТАРТ =====
        addDebug('🎁 Приложение загружено');
        (async () => {
            try {
                await loadPrizes();
            } catch (e) {
                addDebug(`❌ Ошибка загрузки призов: ${e.message}`);
            }
            setTimeout(checkStatus, 600);
        })();
    </script>
</body>
</html>
