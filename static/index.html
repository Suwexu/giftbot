<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Колесо Бонусов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 15px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 {
            font-size: 26px;
            background: linear-gradient(90deg, #f5c842, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .balance-container {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 20px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            border: 1px solid rgba(245, 200, 66, 0.2);
        }
        .balance-amount { font-size: 22px; font-weight: bold; color: #f5c842; }
        #spinCanvas {
            display: block;
            width: 100%;
            max-width: 400px;
            height: auto;
            aspect-ratio: 1/1;
            margin: 0 auto 20px;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(245, 200, 66, 0.1);
            background: #2d3a5e;
            cursor: pointer;
            touch-action: manipulation;
        }
        .status-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 15px;
            margin: 15px 0;
            font-size: 16px;
            text-align: center;
            color: #fff;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .status-box .emoji { font-size: 24px; margin-right: 10px; }
        .status-box .retry-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 5px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }
        #spinBtn {
            background: linear-gradient(145deg, #f5c842, #d4a021);
            border: none;
            color: #1a1a2e;
            font-weight: bold;
            font-size: 20px;
            padding: 16px 32px;
            border-radius: 50px;
            width: 100%;
            max-width: 280px;
            box-shadow: 0 5px 25px rgba(245, 200, 66, 0.3);
            cursor: pointer;
            transition: opacity 0.3s;
        }
        #spinBtn:disabled {
            background: #444;
            color: #888;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .timer {
            font-size: 18px;
            color: #ff6b6b;
            font-weight: bold;
            margin-top: 15px;
            text-align: center;
            font-family: 'Courier New', monospace;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
        }
        .debug-info {
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 12px;
            color: #aaa;
            max-height: 150px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>🎡 Колесо Бонусов</h1></div>
        <div class="balance-container">
            <span>💰</span>
            <span class="balance-amount" id="balanceDisplay">0</span>
        </div>
        <canvas id="spinCanvas" width="600" height="600"></canvas>
        <div class="status-box" id="statusMessage">
            <span class="emoji">⏳</span>
            <span>Загрузка...</span>
        </div>
        <div style="text-align: center;">
            <button id="spinBtn" disabled>🎰 Крутить!</button>
        </div>
        <div id="timerDisplay" class="timer"></div>
        <div class="footer">Вращение доступно раз в 24 часа</div>
        <div id="debugInfo" class="debug-info"></div>
    </div>

    <script>
        // ============================================================
        // 1. ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        console.log('🚀 Telegram WebApp загружен');
        console.log('👤 User ID:', tg.initDataUnsafe?.user?.id || 'неизвестно');

        // ============================================================
        // 2. НАСТРОЙКИ КОЛЕСА
        // ============================================================
        const segments = [
            { label: '100', value: 100, color: '#f94144' },
            { label: '50', value: 50, color: '#f3722c' },
            { label: '20', value: 20, color: '#f8961e' },
            { label: '10', value: 10, color: '#f9c74f' },
            { label: '5', value: 5, color: '#90be6d' },
            { label: '200', value: 200, color: '#43aa8b' },
            { label: '0', value: 0, color: '#577590' },
            { label: '⭐', value: 50, color: '#9b5de5' }
        ];

        // ============================================================
        // 3. DOM ЭЛЕМЕНТЫ
        // ============================================================
        const canvas = document.getElementById('spinCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const statusMsg = document.getElementById('statusMessage');
        const timerDisplay = document.getElementById('timerDisplay');
        const balanceDisplay = document.getElementById('balanceDisplay');
        const debugInfo = document.getElementById('debugInfo');

        const segmentAngle = (2 * Math.PI) / segments.length;
        let currentRotation = 0;
        let isSpinning = false;
        let canSpin = false;
        let timerInterval = null;

        // ============================================================
        // 4. ОТЛАДКА
        // ============================================================
        function addDebug(msg) {
            const time = new Date().toLocaleTimeString();
            console.log(`🐛 ${time}: ${msg}`);
            debugInfo.innerHTML += `<div>${time}: ${msg}</div>`;
            debugInfo.scrollTop = debugInfo.scrollHeight;
        }

        // ============================================================
        // 5. РИСОВАНИЕ КОЛЕСА
        // ============================================================
        function drawWheel(rotation) {
            const width = canvas.width, height = canvas.height;
            const centerX = width/2, centerY = height/2;
            const radius = Math.min(width, height)/2 * 0.88;
            ctx.clearRect(0, 0, width, height);
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 30;
            
            for (let i = 0; i < segments.length; i++) {
                const startAngle = rotation + i * segmentAngle;
                const endAngle = startAngle + segmentAngle;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = segments[i].color;
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + segmentAngle/2);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 24px Arial';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 10;
                ctx.fillText(segments[i].label, radius * 0.65, 0);
                ctx.restore();
            }
            
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 25, 0, 2*Math.PI);
            ctx.fillStyle = '#ffd700';
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.shadowColor = 'rgba(255,215,0,0.5)';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.moveTo(centerX-15, 15);
            ctx.lineTo(centerX+15, 15);
            ctx.lineTo(centerX, 45);
            ctx.closePath();
            ctx.fillStyle = '#ffd700';
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function getPrize(rotation) {
            const pointerAngle = -Math.PI/2;
            let rawAngle = (pointerAngle - rotation) % (2*Math.PI);
            if (rawAngle < 0) rawAngle += 2*Math.PI;
            const index = Math.floor(rawAngle / segmentAngle) % segments.length;
            return {
                index: index,
                label: segments[index].label,
                value: segments[index].value
            };
        }

        // ============================================================
        // 6. ОБНОВЛЕНИЕ ИНТЕРФЕЙСА
        // ============================================================
        function updateStatus(emoji, text, isError = false) {
            const emojiSpan = `<span class="emoji">${emoji}</span>`;
            const textSpan = `<span style="${isError ? 'color:#ff6b6b;' : ''}">${text}</span>`;
            const retryBtn = isError ? `<button class="retry-btn" onclick="checkStatus()">🔄 Повторить</button>` : '';
            statusMsg.innerHTML = emojiSpan + textSpan + retryBtn;
        }

        function updateTimer(seconds) {
            if (seconds <= 0) {
                timerDisplay.textContent = '';
                return;
            }
            const hours = Math.floor(seconds/3600);
            const mins = Math.floor((seconds%3600)/60);
            const secs = seconds%60;
            timerDisplay.textContent = `⏳ ${String(hours).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
        }

        function updateBalance(balance) {
            balanceDisplay.textContent = balance;
        }

        // ============================================================
        // 7. СВЯЗЬ С СЕРВЕРОМ (HTTP API, а не tg.sendData!)
        // ============================================================
        // tg.sendData() закрывает Mini App сразу после вызова — ответ
        // внутри приложения получить невозможно. Поэтому используем
        // обычные fetch()-запросы к API бота.
        const API_BASE = 'https://cyberxgift.ru';

        async function apiFetch(path, options = {}) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000);
            try {
                const resp = await fetch(API_BASE + path, { ...options, signal: controller.signal });
                clearTimeout(timeoutId);
                if (!resp.ok) {
                    throw new Error(`HTTP ${resp.status}`);
                }
                return await resp.json();
            } catch (e) {
                clearTimeout(timeoutId);
                throw e;
            }
        }

        // ============================================================
        // 8. ПРОВЕРКА СТАТУСА
        // ============================================================
        async function checkStatus() {
            addDebug('🔍 Проверка статуса...');
            updateStatus('⏳', 'Проверка...');
            spinBtn.disabled = true;

            try {
                const data = await apiFetch(`/api/status?init_data=${encodeURIComponent(tg.initData)}`);
                addDebug(`📨 Ответ: status=${data.status}`);
                handleServerResponse(data);
            } catch (e) {
                addDebug(`⏰ Ошибка запроса: ${e.message}`);
                updateStatus('⚠️', 'Нет ответа от сервера', true);
                spinBtn.disabled = true;
            }
        }

        // ============================================================
        // 9. ВРАЩЕНИЕ КОЛЕСА
        // ============================================================
        function spinWheel() {
            if (isSpinning || !canSpin) {
                addDebug('⚠️ Вращение заблокировано');
                return;
            }
            isSpinning = true;
            spinBtn.disabled = true;
            updateStatus('🌀', 'Колесо вращается...');
            
            const extraSpins = 5 + Math.random() * 3;
            const targetAngle = extraSpins * 2 * Math.PI + Math.random() * 2 * Math.PI;
            const startRotation = currentRotation;
            const endRotation = startRotation + targetAngle;
            const duration = 4000;
            const startTime = performance.now();
            
            function animate(time) {
                const elapsed = time - startTime;
                const progress = Math.min(elapsed/duration, 1);
                const ease = 1 - Math.pow(1-progress, 3);
                currentRotation = startRotation + targetAngle * ease;
                drawWheel(currentRotation);
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    currentRotation = endRotation;
                    drawWheel(endRotation);
                    const prize = getPrize(endRotation);
                    updateStatus('🎁', `Выпало: ${prize.label} ${prize.value > 0 ? 'монет' : ''}`);
                    isSpinning = false;
                    sendSpinResult(prize);
                }
            }
            requestAnimationFrame(animate);
        }

        // ============================================================
        // 10. ОТПРАВКА РЕЗУЛЬТАТА СПИНА И ОБРАБОТКА ОТВЕТОВ СЕРВЕРА
        // ============================================================
        async function sendSpinResult(prize) {
            addDebug(`📤 Отправка результата: ${prize.label} (${prize.value})`);
            try {
                const data = await apiFetch('/api/spin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        init_data: tg.initData,
                        prize_id: prize.index,
                        prize_name: prize.label,
                        value: prize.value
                    })
                });
                addDebug(`📨 Ответ: status=${data.status}`);
                handleServerResponse(data);
            } catch (e) {
                addDebug(`❌ Ошибка отправки: ${e.message}`);
                updateStatus('⚠️', 'Нет ответа от сервера', true);
            }
        }

        function handleServerResponse(data) {
            if (data.status === 'can_spin') {
                canSpin = true;
                spinBtn.disabled = false;
                updateStatus('🎯', 'Нажми на кнопку или коснись колеса!');
                timerDisplay.textContent = '';
                if (data.balance !== undefined) updateBalance(data.balance);
                addDebug('🎯 Можно крутить!');

            } else if (data.status === 'wait') {
                canSpin = false;
                spinBtn.disabled = true;
                updateStatus('⏳', 'Кулдаун активен!');
                updateTimer(data.wait_time);
                if (data.balance !== undefined) updateBalance(data.balance);
                addDebug(`⏳ Ожидание ${data.wait_time} секунд`);

                if (timerInterval) clearInterval(timerInterval);
                let remaining = data.wait_time;
                timerInterval = setInterval(() => {
                    remaining--;
                    updateTimer(remaining);
                    if (remaining <= 0) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        checkStatus();
                    }
                }, 1000);

            } else if (data.status === 'success') {
                updateStatus('🎉', `Выиграно ${data.prize} монет!`);
                if (data.new_balance !== undefined) updateBalance(data.new_balance);
                addDebug(`🎉 Выиграно ${data.value} монет!`);
                try {
                    tg.showPopup({
                        title: '🎉 Поздравляем!',
                        message: `Вы выиграли ${data.value} монет!`,
                        buttons: [{ type: 'ok' }]
                    });
                } catch (e) {}
                setTimeout(checkStatus, 3000);

            } else if (data.error) {
                updateStatus('❌', data.error, true);
                addDebug(`❌ Ошибка: ${data.error}`);
            }
        }

        // ============================================================
        // 11. ОБРАБОТЧИКИ СОБЫТИЙ
        // ============================================================
        spinBtn.addEventListener('click', spinWheel);
        canvas.addEventListener('click', () => {
            if (canSpin && !isSpinning) spinWheel();
        });

        // ============================================================
        // 12. ЗАПУСК
        // ============================================================
        drawWheel(0);
        addDebug('🎡 Приложение загружено');
        
        // Запрос статуса через 1 секунду
        setTimeout(checkStatus, 1000);

        console.log('✅ Мини-приложение готово!');
    </script>
</body>
</html>
