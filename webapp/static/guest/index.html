<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>CyberX Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Chakra+Petch:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div class="scanlines"></div>
<div class="grid-bg"></div>

<header class="topbar">
  <div class="logo">
    <span class="logo-bracket">[</span>CYBER<span class="accent-x">X</span><span class="logo-bracket">]</span>
  </div>
  <div class="user-chip" id="userChip">гость</div>
</header>

<main id="view-prizes" class="view active">
  <div class="hero">
    <p class="eyebrow">// зона выдачи наград</p>
    <h1>Забери свой дроп</h1>
    <p class="sub">Жми на капсулу — приз попадёт в корзинку на 24 часа, потом можно забрать на ресепшене.</p>
  </div>

  <button id="spinBtn" class="capsule-btn">
    <span class="capsule-ring"></span>
    <span class="capsule-core">
      <span class="capsule-icon">◆</span>
      <span class="capsule-label">ОТКРЫТЬ</span>
    </span>
  </button>

  <div id="prizeResult" class="prize-result hidden"></div>
</main>

<main id="view-vault" class="view">
  <div class="hero">
    <p class="eyebrow">// хранилище наград</p>
    <h1>Корзинка</h1>
    <p class="sub">Здесь лежит всё, что ты выиграл. Под замком — 24 часа с момента дропа.</p>
  </div>
  <div id="vaultList" class="vault-list"></div>
</main>

<nav class="tabbar">
  <button class="tab-btn active" data-view="view-prizes">
    <span class="tab-icon">🎁</span>
    <span>Призы</span>
  </button>
  <button class="tab-btn" data-view="view-vault">
    <span class="tab-icon tab-icon-lock">🔒</span>
    <span>Корзинка</span>
    <span id="vaultBadge" class="tab-badge hidden">0</span>
  </button>
</nav>

<script src="app.js"></script>
</body>
</html>
