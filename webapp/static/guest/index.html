<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CyberX Gifts</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  background: linear-gradient(145deg,#0a0f1a 0%,#1a1a2e 100%);
  min-height:100vh; color:#fff; padding:16px;
  font-family:'Segoe UI',Roboto,system-ui,-apple-system,sans-serif;
  display:flex; justify-content:center;
}
.container {
  width:100%; max-width:420px; background:rgba(255,255,255,.03);
  border:1px solid rgba(255,215,0,.15); border-radius:32px; padding:20px 16px;
  box-shadow:0 20px 60px rgba(0,0,0,.8); align-self:flex-start;
}
.title {
  text-align:center; font-size:18px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
  background:linear-gradient(135deg,#f5af19,#f12711); -webkit-background-clip:text;
  -webkit-text-fill-color:transparent; background-clip:text; margin-bottom:16px;
}
.tabs { display:flex; gap:8px; margin-bottom:18px; }
.tab {
  flex:1; padding:10px; border-radius:100px; border:1px solid rgba(255,255,255,.08);
  background:rgba(0,0,0,.3); color:#b0b0c8; font-weight:600; font-size:14px; cursor:pointer;
}
.tab.active { background:linear-gradient(145deg,#f5af19,#f12711); color:#fff; border-color:transparent; }
.view { display:none; }
.view.active { display:block; }

.case-box {
  background:linear-gradient(145deg,#2a2a3e,#161622); border-radius:24px; padding:28px 16px;
  border:1px solid rgba(255,255,255,.06); box-shadow:inset 0 0 40px rgba(0,0,0,.6);
  min-height:230px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
}
.case-box.opening { border-color:#ffd700; box-shadow:0 0 40px rgba(255,215,0,.2), inset 0 0 40px rgba(255,215,0,.05); }
.case-img {
  width:120px; height:120px; border-radius:20px; border:2px solid #ffd700; margin-bottom:16px;
  background:linear-gradient(145deg,#3d3d5c,#1e1e32); display:flex; align-items:center; justify-content:center;
  font-size:56px; overflow:hidden;
}
.case-img img { width:100%; height:100%; object-fit:cover; }
.case-name { font-size:18px; font-weight:700; color:#fff; word-break:break-word; }
.case-sub { margin-top:6px; font-size:13px; color:#b0b0c8; }
.status { min-height:24px; margin:14px 0; text-align:center; font-size:15px; color:#b0b0c8; }
.status.err { color:#ff6b6b; } .status.ok { color:#69db7c; }

.open-btn {
  display:block; width:100%; max-width:280px; margin:0 auto; padding:16px; border:none; border-radius:100px;
  background:linear-gradient(145deg,#f5af19,#f12711); color:#fff; font-weight:800; font-size:18px;
  letter-spacing:2px; text-transform:uppercase; cursor:pointer; box-shadow:0 8px 30px rgba(241,39,17,.3);
  touch-action:manipulation;
}
.open-btn:active:not(:disabled) { transform:scale(.96); }
.open-btn:disabled { background:#3a3a4e; color:#888; box-shadow:none; cursor:not-allowed; opacity:.7; }

.prize-list { margin-top:20px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
.chip { font-size:12px; padding:6px 10px; border-radius:100px; background:rgba(255,255,255,.06); color:#b0b0c8; }

.vault-item {
  display:flex; gap:12px; align-items:center; padding:12px; margin-bottom:10px; border-radius:18px;
  background:rgba(0,0,0,.3); border:1px solid rgba(255,255,255,.06);
}
.vault-thumb {
  width:52px; height:52px; border-radius:12px; flex:none; overflow:hidden; font-size:26px;
  background:linear-gradient(145deg,#3d3d5c,#1e1e32); display:flex; align-items:center; justify-content:center;
}
.vault-thumb img { width:100%; height:100%; object-fit:cover; }
.vault-body { flex:1; min-width:0; }
.vault-name { font-weight:700; font-size:15px; word-break:break-word; }
.vault-state { font-size:13px; margin-top:3px; }
.st-locked { color:#ffb347; } .st-unlocked { color:#69db7c; } .st-issued { color:#8a8aa5; }
.empty { text-align:center; color:#8a8aa5; padding:30px 0; font-size:14px; }
.footer { margin-top:20px; text-align:center; font-size:11px; color:rgba(255,255,255,.2); letter-spacing:1px; }
</style>
</head>
<body>
<div class="container">
  <div class="title">🎁 CyberX Gifts</div>

  <div class="tabs">
    <button class="tab active" data-tab="prizes">Призы</button>
    <button class="tab" data-tab="vault">Корзинка</button>
  </div>

  <div class="view active" id="view-prizes">
    <div class="case-box" id="caseBox">
      <div class="case-img" id="caseImg">🔒</div>
      <div class="case-name" id="caseName">Открой кейс</div>
      <div class="case-sub" id="caseSub">Приз попадёт в корзинку на 24 часа</div>
    </div>
    <div class="status" id="status">⏳ Загрузка...</div>
    <button class="open-btn" id="openBtn" disabled>Открыть</button>
    <div class="prize-list" id="prizeList"></div>
  </div>

  <div class="view" id="view-vault">
    <div id="vaultList"></div>
  </div>

  <div class="footer">CYBERX</div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
const initData = tg ? tg.initData : '';

const $ = (id) => document.getElementById(id);
const statusEl = $('status'), openBtn = $('openBtn'), caseBox = $('caseBox');
const caseImg = $('caseImg'), caseName = $('caseName'), caseSub = $('caseSub');

let prizes = [];
let vault = [];
let busy = false;
let vaultTimer = null;

function setStatus(text, kind) {
  statusEl.textContent = text;
  statusEl.className = 'status' + (kind ? ' ' + kind : '');
}

// Запрос к серверу. Render на бесплатном тарифе может «просыпаться» до минуты,
// поэтому таймаут большой.
async function api(path, body) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 70000);
  try {
    const opts = { signal: ctrl.signal };
    if (body !== undefined) {
      opts.method = 'POST';
      opts.headers = { 'Content-Type': 'application/json' };
      opts.body = JSON.stringify(Object.assign({ initData }, body));
    }
    const r = await fetch(path, opts);
    let data = null;
    try { data = await r.json(); } catch (e) {}
    if (!r.ok || !data || !data.ok) {
      throw new Error((data && (data.error || data.message)) || ('HTTP ' + r.status));
    }
    return data;
  } finally {
    clearTimeout(t);
  }
}

function imgOrEmoji(el, url, emoji) {
  el.textContent = '';
  if (url) {
    const img = document.createElement('img');
    img.src = url;
    img.alt = '';
    img.onerror = () => { el.textContent = emoji; };
    el.appendChild(img);
  } else {
    el.textContent = emoji;
  }
}

function parseUtc(s) {
  return new Date(/[zZ]|[+-]\d\d:\d\d$/.test(s) ? s : s + 'Z');
}

function fmtLeft(sec) {
  sec = Math.max(0, sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return [h, m, s].map(n => String(n).padStart(2, '0')).join(':');
}

// ---------- Призы ----------
function renderPrizes() {
  const box = $('prizeList');
  box.textContent = '';
  prizes.forEach(p => {
    const c = document.createElement('span');
    c.className = 'chip';
    c.textContent = p.name;
    box.appendChild(c);
  });
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function openCase() {
  if (busy) return;
  busy = true;
  openBtn.disabled = true;
  setStatus('🎲 Открываем...');
  caseBox.classList.add('opening');

  let result;
  try {
    // запрос к серверу идёт параллельно с анимацией
    const req = api('/api/spin', {});
    for (let i = 0; i < 14; i++) {
      const p = prizes[Math.floor(Math.random() * prizes.length)];
      if (p) { imgOrEmoji(caseImg, p.image_url, '🎁'); caseName.textContent = p.name; }
      await sleep(110);
    }
    result = (await req).prize;
  } catch (e) {
    caseBox.classList.remove('opening');
    imgOrEmoji(caseImg, '', '🔒');
    caseName.textContent = 'Открой кейс';
    setStatus('❌ ' + e.message, 'err');
    busy = false;
    openBtn.disabled = false;
    return;
  }

  caseBox.classList.remove('opening');
  imgOrEmoji(caseImg, result.prize_image, '🎉');
  caseName.textContent = result.prize_name;
  caseSub.textContent = 'Лежит в корзинке, забрать можно через 24 часа';
  setStatus('🎉 Вы выиграли приз!', 'ok');
  try { if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}

  await loadVault();
  busy = false;
  openBtn.disabled = false;
  openBtn.textContent = 'Открыть ещё';
}

// ---------- Корзинка ----------
function renderVault() {
  const list = $('vaultList');
  list.textContent = '';
  if (!vault.length) {
    const d = document.createElement('div');
    d.className = 'empty';
    d.textContent = 'Пока пусто. Открой кейс!';
    list.appendChild(d);
    return;
  }
  vault.forEach(it => {
    const row = document.createElement('div');
    row.className = 'vault-item';
    const th = document.createElement('div'); th.className = 'vault-thumb';
    imgOrEmoji(th, it.prize_image, '🎁');
    const body = document.createElement('div'); body.className = 'vault-body';
    const nm = document.createElement('div'); nm.className = 'vault-name'; nm.textContent = it.prize_name;
    const st = document.createElement('div'); st.className = 'vault-state';
    st.dataset.unlock = it.unlock_at;
    st.dataset.status = it.display_status;
    body.appendChild(nm); body.appendChild(st);
    row.appendChild(th); row.appendChild(body);
    list.appendChild(row);
  });
  tickVault();
}

function tickVault() {
  const now = Date.now();
  document.querySelectorAll('.vault-state').forEach(el => {
    const status = el.dataset.status;
    if (status === 'issued') {
      el.className = 'vault-state st-issued';
      el.textContent = '✅ Выдан';
      return;
    }
    const left = Math.ceil((parseUtc(el.dataset.unlock).getTime() - now) / 1000);
    if (left > 0) {
      el.className = 'vault-state st-locked';
      el.textContent = '🔒 Откроется через ' + fmtLeft(left);
    } else {
      el.className = 'vault-state st-unlocked';
      el.textContent = '🔓 Можно забрать на ресепшене';
    }
  });
}

async function loadVault() {
  try {
    vault = (await api('/api/vault', {})).items || [];
    renderVault();
  } catch (e) {
    $('vaultList').textContent = '';
    const d = document.createElement('div');
    d.className = 'empty';
    d.textContent = '❌ ' + e.message;
    $('vaultList').appendChild(d);
  }
}

// ---------- Вкладки ----------
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + btn.dataset.tab));
    if (btn.dataset.tab === 'vault') loadVault();
  });
});
openBtn.addEventListener('click', openCase);

// ---------- Старт ----------
async function boot() {
  if (!initData) {
    setStatus('❌ Откройте приложение через бота в Telegram', 'err');
    return;
  }
  setStatus('⏳ Подключаемся к серверу (может занять до минуты)...');
  try {
    await api('/api/verify', {});
    prizes = (await api('/api/prizes')).prizes || [];
    renderPrizes();
    if (!prizes.length) {
      setStatus('Призов пока нет. Загляните позже.', 'err');
    } else {
      setStatus('🎯 Нажмите «Открыть»');
      openBtn.textContent = 'Открыть';
      openBtn.disabled = false;
    }
    loadVault();
    vaultTimer = setInterval(tickVault, 1000);
  } catch (e) {
    setStatus('❌ ' + e.message, 'err');
  }
}
boot();
</script>
</body>
</html>
